name: lint

# Fast, build-free static guards that run on every push/PR. Cheap enough
# to gate merges without waiting on the ~20min cross-platform compile.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  string-sinks:
    name: source safety ratchets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ratchet sprintf / strcpy / strcat
        # Fails only when a change ADDS a new unbounded sink above the
        # committed baseline (tools/string_sink_baseline.json). Lower the
        # baseline by running `tools/lint_string_sinks.py --update` after
        # converting a legacy site to snprintf / strlcpy / strlcat.
        run: python3 tools/lint_string_sinks.py

      - name: Ratchet compile-time campaign identity
        # Both campaign implementations are selected through GameCapabilities
        # in migrated engine/orchestration code. The remaining application and
        # content guards may only shrink, never move or grow.
        run: python3 tools/lint_campaign_compile_guards.py

      - name: Ratchet direct world-tile storage access
        # World Tile Map owns allocation and exposes gpWorldLevelData only as a
        # shrinking compatibility projection. New code enters through the
        # accessor instead of growing the raw global-indexing tail.
        run: python3 tools/lint_world_tile_access.py

      - name: Validate all compiled-text catalogs
        # Structural parity is mandatory for all eight languages and all four
        # JA2/JA2UB x release/debug quadrants.  The legacy executable matrix may
        # still treat foreign compiles as soft while this build-free gate does not.
        run: |
          python3 tools/check_i18n_text_schema.py
          python3 -m unittest tools/test_check_i18n_text_schema.py

      - name: Validate release metadata stamping
        run: |
          python3 tools/stamp_game_version.py \
            --source Ja2/GameVersion.cpp \
            --version v0.9.0-test \
            --build "EN v0.9.0-test GitHub test/repository 01234567"

      - name: Validate release packaging and ownership
        run: |
          python3 tools/check_release_workflow.py
          python3 -m unittest tools/test_check_release_workflow.py
