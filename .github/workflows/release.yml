name: release

# Tagged-release pipeline. Push a tag like `v0.1.0` (or run manually) and
# this builds the three shipped apps -- JA2_ENGLISH, JA2UB_ENGLISH,
# JA2MAPEDITOR_ENGLISH -- plus the standalone ja2server multiplayer
# coordinator, on Linux, macOS and Windows, and attaches per-platform game and
# Engine SDK archives to a GitHub Release. The game apps sit at the archive
# root; the server (with a sample ja2_mp.ini + README) is in a ja2server/
# subfolder. The SDK archive is the installable EngineSDK CMake component for
# the same platform/toolchain, including examples and its compatibility kit.
# The four game zip assets remain the compatibility contract. Linux jobs also
# emit byte-reproducible AppImages, and the Windows job emits a native NSIS
# setup.
#
# The build steps deliberately mirror build_unix.yml (the per-commit
# compile-check) so the toolchain stays identical; the extra work here
# is staging + packaging + publishing.
#
# SDL3, SDL3_mixer and their vendored codecs are linked statically into
# each executable (BUILD_SHARED_LIBS=OFF / SDL_STATIC in CMakeLists), so
# the archives are just the self-contained executables -- no SDL .dll /
# .dylib / .so to ship, and no ABI-mismatch risk from a stray system SDL.
#
# These archives contain the ENGINE only -- no game Data. Drop the game apps
# into an existing JA2 1.13 install (which provides Data/) to run. The
# ja2server/ folder is self-contained and needs no game Data.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional label for a manual (non-tag) package build'
        required: false

permissions:
  contents: write   # create/update the GitHub Release + upload assets

jobs:
  package:
    name: package (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,    name: linux,       family: linux }
          - { os: ubuntu-24.04-arm, name: linux-arm64, family: linux }
          - { os: macos-latest,     name: macos,       family: macos }
          - { os: windows-latest,   name: windows,     family: windows }
    runs-on: ${{ matrix.platform.os }}

    # sccache caches compiled objects (SDL3 + deps + engine) across runs, so
    # release builds don't recompile the world every tag. Persist sccache's
    # local disk cache via first-party actions/cache (sccache's own GHA
    # backend targets the retired v1 cache API). See build_unix.yml.
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python for release metadata
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Stamp release version
        shell: bash
        env:
          REQUESTED_RELEASE_LABEL: ${{ github.event.inputs.tag }}
        run: |
          set -eux
          RELEASE_LABEL="${REQUESTED_RELEASE_LABEL:-$GITHUB_REF_NAME}"
          if [[ ! "$RELEASE_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "release label must use 1-128 ASCII letters, digits, dots, underscores, or hyphens" >&2
            exit 64
          fi
          SOURCE_COMMIT_DATE="$(TZ=UTC0 git show -s --date=short-local --format=%cd "$GITHUB_SHA")"
          BUILD_LABEL="EN ${SOURCE_COMMIT_DATE} GitHub ${GITHUB_REPOSITORY}"
          python tools/stamp_game_version.py \
            --source Ja2/GameVersion.cpp \
            --version "$RELEASE_LABEL" \
            --build "$BUILD_LABEL"
          echo "RELEASE_LABEL=$RELEASE_LABEL" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Cache sccache storage
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ matrix.platform.name }}-rel-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.platform.name }}-

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      # ---- toolchain / build deps (identical to build_unix.yml) ----
      - name: Install Linux build deps
        if: matrix.platform.family == 'linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxss-dev libxkbcommon-dev \
            libxtst-dev libxfixes-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev
          echo "CC=clang"   >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Install macOS build deps
        if: matrix.platform.name == 'macos'
        run: |
          set -eux
          brew install cmake ninja

      - name: Set up MSVC environment (Windows)
        if: matrix.platform.name == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Select clang toolchain (Windows)
        if: matrix.platform.name == 'windows'
        shell: bash
        run: |
          echo "CC=clang"                                  >> $GITHUB_ENV
          echo "CXX=clang++"                               >> $GITHUB_ENV
          echo "CFLAGS=--target=x86_64-pc-windows-msvc"    >> $GITHUB_ENV
          echo "CXXFLAGS=--target=x86_64-pc-windows-msvc"  >> $GITHUB_ENV

      # ---- configure (all three apps in one tree) + build ----
      - name: Configure
        shell: bash
        run: |
          set -eux
          cache_args=()
          if command -v sccache >/dev/null 2>&1; then
            cache_args+=(
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache setup unavailable; building without a compiler cache"
          fi
          # SDL3, SDL3_mixer and their vendored codecs are linked statically
          # (BUILD_SHARED_LIBS=OFF / SDL_STATIC in CMakeLists), so the
          # executables are self-contained and no rpath / bundled libs are
          # needed.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLanguages=ENGLISH \
            "-DApplications=JA2;JA2UB;JA2MAPEDITOR" \
            -DBUILD_JA2SERVER=ON \
            "${cache_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache unavailable; no cache statistics"
          fi

      # ---- stage: self-contained executables (SDL3/SDL3_mixer + codecs are
      # statically linked in, so no runtime libs to ship) ----
      - name: Stage payload (linux)
        if: matrix.platform.family == 'linux'
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          for app in JA2 JA2UB JA2MAPEDITOR; do
            cp "build/${app}_ENGLISH" dist/
          done
          # standalone multiplayer coordinator + its sample config / readme
          mkdir -p dist/ja2server
          cp build/tests/ja2server                     dist/ja2server/ja2server
          cp Multiplayer/ja2server/ja2_mp.ini.sample   dist/ja2server/ja2_mp.ini
          cp Multiplayer/ja2server/README.md           dist/ja2server/README.md

      - name: Stage payload (macos)
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          # macOS targets build as .app bundles (MACOSX_BUNDLE) so they launch from
          # Finder without a Terminal; ship the bundle directory. Game data is not
          # inside the .app -- drop it into an existing JA2 1.13 folder to run.
          for app in JA2 JA2UB JA2MAPEDITOR; do
            cp -R "build/${app}_ENGLISH.app" dist/
          done
          # standalone multiplayer coordinator (plain binary, not a .app) + config / readme
          mkdir -p dist/ja2server
          cp build/tests/ja2server                     dist/ja2server/ja2server
          cp Multiplayer/ja2server/ja2_mp.ini.sample   dist/ja2server/ja2_mp.ini
          cp Multiplayer/ja2server/README.md           dist/ja2server/README.md

      - name: Sign and verify macOS app bundles
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          set -eux
          # Apple's linker emits an executable-only ad-hoc signature. Re-sign
          # each staged bundle so Info.plist and bundle resources are sealed;
          # otherwise codesign rejects the app after it is extracted.
          for app in JA2 JA2UB JA2MAPEDITOR; do
            bundle="dist/${app}_ENGLISH.app"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Stage payload (windows)
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($app in 'JA2','JA2UB','JA2MAPEDITOR') {
            Copy-Item "build/$($app)_ENGLISH.exe" dist/
          }
          # standalone multiplayer coordinator + its sample config / readme
          New-Item -ItemType Directory -Force dist/ja2server | Out-Null
          Copy-Item "build/tests/ja2server.exe"             dist/ja2server/
          Copy-Item "Multiplayer/ja2server/ja2_mp.ini.sample" dist/ja2server/ja2_mp.ini
          Copy-Item "Multiplayer/ja2server/README.md"        dist/ja2server/README.md

      - name: Stage and verify Engine SDK
        shell: bash
        run: |
          set -eux
          cmake --install build \
            --prefix sdk-dist \
            --component EngineSDK \
            --config Release
          cmake \
            -DJA2_ENGINE_SDK_MANIFEST=sdk-dist/share/JA2Engine/compatibility/JA2EngineCompatibility.json \
            -P sdk-dist/share/JA2Engine/compatibility/VerifyManifest.cmake

      # ---- game + platform-matching SDK archives (.zip everywhere) ----
      - name: Resolve package name
        shell: bash
        run: |
          set -eux
          echo "PKG=ja2-sdl3-${{ matrix.platform.name }}-${RELEASE_LABEL}" >> "$GITHUB_ENV"
          echo "SDK_PKG=ja2-engine-sdk-${{ matrix.platform.name }}-${RELEASE_LABEL}" >> "$GITHUB_ENV"

      - name: Archive (unix)
        if: matrix.platform.name != 'windows'
        shell: bash
        run: |
          set -eux
          ( cd dist && zip -r "../${PKG}.zip" . )
          ( cd sdk-dist && zip -r "../${SDK_PKG}.zip" . )
          echo "ASSET=${PKG}.zip" >> "$GITHUB_ENV"
          echo "SDK_ASSET=${SDK_PKG}.zip" >> "$GITHUB_ENV"

      - name: Archive (windows)
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "$env:PKG.zip"
          Compress-Archive -Path sdk-dist/* -DestinationPath "$env:SDK_PKG.zip"
          "ASSET=$env:PKG.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SDK_ASSET=$env:SDK_PKG.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # AppImage's current official tools are published from moving
      # `continuous` releases. Checksums make that input immutable: a replaced
      # upstream asset fails closed until this workflow is deliberately updated.
      - name: Download checksum-pinned AppImage tools
        if: matrix.platform.family == 'linux'
        shell: bash
        run: |
          set -eux
          mkdir -p .release-tools
          case "${{ matrix.platform.name }}" in
            linux)
              arch=x86_64
              tool_sha=a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
              runtime_sha=1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
              ;;
            linux-arm64)
              arch=aarch64
              tool_sha=1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
              runtime_sha=7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
              ;;
            *)
              echo "unsupported AppImage matrix entry" >&2
              exit 64
              ;;
          esac
          tool="$PWD/.release-tools/appimagetool-${arch}.AppImage"
          runtime="$PWD/.release-tools/runtime-${arch}"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 5 --retry-all-errors \
            --output "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 5 --retry-all-errors \
            --output "$runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${arch}"
          printf '%s  %s\n' "$tool_sha" "$tool" | sha256sum --check --strict
          printf '%s  %s\n' "$runtime_sha" "$runtime" | sha256sum --check --strict
          chmod 0755 "$tool"
          echo "APPIMAGE_ARCH=$arch" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Build and reproduce AppImage
        if: matrix.platform.family == 'linux'
        shell: bash
        run: |
          set -eux
          first_appdir="$RUNNER_TEMP/ja2-appdir-first"
          second_appdir="$RUNNER_TEMP/ja2-appdir-second"
          second_image="$RUNNER_TEMP/${PKG}-reproduction.AppImage"
          packaging/linux/prepare_appdir.sh \
            dist "$first_appdir" "$SOURCE_DATE_EPOCH"
          packaging/linux/prepare_appdir.sh \
            dist "$second_appdir" "$SOURCE_DATE_EPOCH"
          packaging/linux/build_appimage.sh \
            "$first_appdir" "${PKG}.AppImage" "$APPIMAGE_ARCH" \
            "$APPIMAGETOOL" "$APPIMAGE_RUNTIME" "$SOURCE_DATE_EPOCH"
          packaging/linux/build_appimage.sh \
            "$second_appdir" "$second_image" "$APPIMAGE_ARCH" \
            "$APPIMAGETOOL" "$APPIMAGE_RUNTIME" "$SOURCE_DATE_EPOCH"
          cmp --silent "${PKG}.AppImage" "$second_image"
          sha256sum "${PKG}.AppImage"
          echo "APPIMAGE_ASSET=${PKG}.AppImage" >> "$GITHUB_ENV"

      - name: Download checksum-pinned NSIS compiler
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $PWD '.release-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $archive = Join-Path $tools 'nsis-3.12.zip'
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip'
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          Invoke-WebRequest -Uri $url -OutFile $archive `
            -MaximumRetryCount 4 -RetryIntervalSec 2
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "NSIS archive checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          # Use the portable distribution's public launcher. It resolves the
          # matching compiler and its Include/Contrib/Stubs directories.
          $compiler = Join-Path $tools 'nsis-3.12/makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "NSIS compiler was not present after extraction"
          }
          "NSIS_MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build native Windows installer
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path '.').Path
          $payload = (Resolve-Path 'dist').Path
          $output = Join-Path $source "${env:PKG}-setup.exe"
          $compilerArguments = @(
            '/V3'
            '/WX'
            '/INPUTCHARSET'
            'UTF8'
            "/DPAYLOAD_DIR=$payload"
            "/DSOURCE_DIR=$source"
            "/DOUTPUT_FILE=$output"
            "/DRELEASE_LABEL=$env:RELEASE_LABEL"
            'packaging/windows/ja2-sdl3.nsi'
          )
          & $env:NSIS_MAKENSIS @compilerArguments
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "makensis did not produce the expected installer"
          }
          "WINDOWS_INSTALLER_ASSET=${env:PKG}-setup.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke-test Windows installer ownership
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'ja2-installer-smoke'
          if (Test-Path -LiteralPath $installRoot) {
            throw "refusing to reuse installer smoke-test directory"
          }
          $serverDirectory = Join-Path $installRoot 'ja2server'
          New-Item -ItemType Directory -Force $serverDirectory | Out-Null
          $serverConfig = Join-Path $serverDirectory 'ja2_mp.ini'
          $serverConfigContents = 'SERVER_NAME = preserve this operator configuration'
          Set-Content -LiteralPath $serverConfig -Value $serverConfigContents
          $foreignUninstaller = Join-Path $installRoot 'Uninstall.exe'
          $foreignUninstallerContents = 'preserve this pre-existing uninstaller'
          Set-Content -LiteralPath $foreignUninstaller -Value $foreignUninstallerContents
          $installer = (Resolve-Path $env:WINDOWS_INSTALLER_ASSET).Path
          $install = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList @('/S', "/D=$installRoot")
          if ($install.ExitCode -ne 0) {
            throw "silent installer failed with exit code $($install.ExitCode)"
          }
          foreach ($application in 'JA2_ENGLISH.exe','JA2UB_ENGLISH.exe','JA2MAPEDITOR_ENGLISH.exe') {
            $staged = Join-Path $PWD "dist/$application"
            $installed = Join-Path $installRoot $application
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
              throw "installer omitted $application"
            }
            if ((Get-FileHash $staged).Hash -ne (Get-FileHash $installed).Hash) {
              throw "installer changed $application"
            }
          }
          if ((Get-Content -LiteralPath $serverConfig -Raw).TrimEnd() -ne $serverConfigContents) {
            throw 'installer overwrote user-owned ja2server configuration'
          }
          if ((Get-Content -LiteralPath $foreignUninstaller -Raw).TrimEnd() -ne $foreignUninstallerContents) {
            throw 'installer overwrote a pre-existing uninstaller'
          }
          $serverSample = Join-Path $serverDirectory 'ja2_mp.ini.sample'
          if (-not (Test-Path -LiteralPath $serverSample -PathType Leaf)) {
            throw 'installer omitted the ja2server configuration sample'
          }
          $dataDirectory = Join-Path $installRoot 'Data'
          New-Item -ItemType Directory -Force $dataDirectory | Out-Null
          $sentinel = Join-Path $dataDirectory 'must-survive-uninstall.txt'
          Set-Content -LiteralPath $sentinel -Value 'user-owned game data'
          $uninstaller = Join-Path $installRoot 'Uninstall-JA2-SDL3.exe'
          $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru `
            -ArgumentList @('/S')
          if ($uninstall.ExitCode -ne 0) {
            throw "silent uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'uninstaller removed user-owned Data content'
          }
          if ((Get-Content -LiteralPath $serverConfig -Raw).TrimEnd() -ne $serverConfigContents) {
            throw 'uninstaller removed or changed user-owned ja2server configuration'
          }
          if ((Get-Content -LiteralPath $foreignUninstaller -Raw).TrimEnd() -ne $foreignUninstallerContents) {
            throw 'uninstaller removed or changed a pre-existing uninstaller'
          }
          if (Test-Path -LiteralPath $serverSample) {
            throw 'uninstaller left its owned ja2server configuration sample'
          }
          foreach ($application in 'JA2_ENGLISH.exe','JA2UB_ENGLISH.exe','JA2MAPEDITOR_ENGLISH.exe') {
            if (Test-Path -LiteralPath (Join-Path $installRoot $application)) {
              throw "uninstaller left owned file $application"
            }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ja2-sdl3-${{ matrix.platform.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Upload AppImage workflow artifact
        if: matrix.platform.family == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ja2-sdl3-${{ matrix.platform.name }}-appimage
          path: ${{ env.APPIMAGE_ASSET }}
          if-no-files-found: error

      - name: Upload Windows installer workflow artifact
        if: matrix.platform.name == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ja2-sdl3-windows-installer
          path: ${{ env.WINDOWS_INSTALLER_ASSET }}
          if-no-files-found: error

      - name: Upload Engine SDK workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ja2-engine-sdk-${{ matrix.platform.name }}
          path: ${{ env.SDK_ASSET }}
          if-no-files-found: error

      # ---- publish to the GitHub Release (tag pushes only) ----
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach AppImage to release
        if: matrix.platform.family == 'linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: ${{ env.APPIMAGE_ASSET }}
          fail_on_unmatched_files: true

      - name: Attach Windows installer to release
        if: matrix.platform.name == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: ${{ env.WINDOWS_INSTALLER_ASSET }}
          fail_on_unmatched_files: true

      - name: Attach Engine SDK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: ${{ env.SDK_ASSET }}
          fail_on_unmatched_files: true
